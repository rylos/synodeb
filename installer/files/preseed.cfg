# synodeb installer: answers needed before the SSH session starts (the DS923+ has no
# screen and no keyboard). Language, keymap, network, host name and the SSH password come
# from the kernel command line written by synodeb-setup.sh on DSM.

d-i preseed/early_command string sh /usr/lib/synodeb-installer/early

# localechooser / console-setup: defaults, overridden on the command line
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# no firmware prompts: the NICs work without their firmware during the installation
# (finish adds firmware-realtek to the installed system when the kernel asked for it)
d-i hw-detect/load_firmware boolean false

# network: DHCP unless the command line sets a static address
d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 20
d-i netcfg/dhcp_timeout string 60
d-i netcfg/get_domain string
d-i netcfg/wireless_wep string

# the installer components come from the Debian mirror and match Debian's kernel, not the
# synodeb one: its modules are already in the initrd
d-i anna/no_kernel_modules boolean true

# mirror (needed before SSH: the network-console component is downloaded)
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# installation over SSH: user "installer", one-time password from the command line
d-i anna/choose_modules string network-console

# no kernel from Debian (the synodeb kernel is installed by finish) and no boot loader
# (the DS923+ firmware boots the Synology GRUB on the DOM)
d-i base-installer/kernel/image string none
d-i grub-installer/skip boolean true
d-i systemd-boot-installer/skip boolean true
d-i lilo-installer/skip boolean true
d-i nobootloader/confirmation_common note
d-i partman-efi/non_efi_system boolean true
# the kernel is started by the Synology GRUB from the DOM: no EFI system partition needed
d-i partman-efi/no_efi boolean false

# a NAS: standard system and SSH server, no desktop
tasksel tasksel/first multiselect standard, ssh-server
d-i popularity-contest/participate boolean false

d-i preseed/late_command string sh /usr/lib/synodeb-installer/finish
d-i finish-install/reboot_in_progress note
