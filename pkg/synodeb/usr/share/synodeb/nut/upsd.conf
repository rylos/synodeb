# synodeb (synodeb-ups setup): upsd on localhost. With NETWORK_CLIENTS in /etc/synodeb/ups.conf
# setup adds LISTEN 0.0.0.0 and ::, and the nftables table inet synodeb_nut
# (synodeb-nut-firewall.service) only admits localhost and those clients on port 3493.
LISTEN 127.0.0.1 3493
LISTEN ::1 3493
# NUT 2.8.1 (trixie) already tolerates a failed LISTEN and does not know the directive (a
# warning in the journal); from NUT 2.8.2 on, without it a failed LISTEN stops upsd.
ALLOW_NOT_ALL_LISTENERS 1
