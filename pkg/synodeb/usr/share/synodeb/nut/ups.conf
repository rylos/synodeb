# synodeb (synodeb-ups setup) — like DSM: usbhid-ups on the first USB UPS found, pollinterval 5,
# no threshold overrides (battery.charge.low and battery.runtime.low come from the UPS).
# To pick one UPS among several add vendorid/productid (lsusb) to the section.
maxretry = 3
pollinterval = 5

[ups]
	driver = usbhid-ups
	port = auto
	desc = "USB UPS"
