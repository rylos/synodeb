# synodeb (synodeb-ups setup) — like DSM's /etc/ups/upssched.conf, "until low battery" mode
CMDSCRIPT /usr/sbin/synodeb-ups
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock
AT ONLINE  * EXECUTE online
AT ONLINE  * CANCEL-TIMER waittimeup
AT ONBATT  * EXECUTE onbatt
AT LOWBATT * EXECUTE lowbatt
AT NOCOMM  * EXECUTE nocomm
AT FSD     * EXECUTE fsd
# DSM "shut down after N minutes on battery" (ups_wait_time): uncomment
# AT ONBATT * START-TIMER waittimeup 300
