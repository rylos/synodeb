# synodeb (synodeb-ups setup) — equivalent of DSM's /etc/ups/upsmon.conf
# root: upssched and the event script must be able to run systemctl isolate/reboot
RUN_AS_USER root
MONITOR ups@localhost 1 monuser __PASSWORD__ primary
MINSUPPLIES 1
# DSM: SHUTDOWNCMD "" (upssched decides). Here the same Safe Mode also from upsmon when
# the UPS is critical (OB+LB, FSD, on battery then unreachable): no poweroff.
SHUTDOWNCMD "/usr/sbin/synodeb-ups safemode-shutdowncmd"
# upsmon stays running after SHUTDOWNCMD (Safe Mode does not power off): the ONLINE event still arrives
SHUTDOWNEXIT no
NOTIFYCMD /usr/sbin/upssched
POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 15
# created by upsmon when the UPS is critical; synodeb-ups deletes it (no UPS power-off
# from the nutshutdown hook, like DSM with ups_safeshutdown=no)
POWERDOWNFLAG /run/nut/killpower
NOTIFYFLAG ONLINE   SYSLOG+EXEC
NOTIFYFLAG ONBATT   SYSLOG+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+EXEC
NOTIFYFLAG NOCOMM   SYSLOG+EXEC
NOTIFYFLAG FSD      SYSLOG+EXEC
NOTIFYFLAG COMMBAD  SYSLOG
NOTIFYFLAG COMMOK   SYSLOG
NOTIFYFLAG SHUTDOWN SYSLOG
NOTIFYFLAG NOPARENT SYSLOG
RBWARNTIME 43200
# NOCOMM after 300 s without communication, like DSM (see NOCOMM_SAFEMODE in /etc/synodeb/ups.conf)
NOCOMMWARNTIME 300
FINALDELAY 5
