# synodeb board file: everything specific to one model. Read by synodeb-setup.sh (embedded by
# tools/sync-boards.sh), the installer and the synology package (/usr/share/synodeb/boards).
# Shell syntax, KEY="value" lines only, no commands.
MODEL="DS423+"          # syno_hw_version under DSM, DMI product name under Debian
PLATFORM="geminilake"   # platforms/<platform>
TIER="community"       # supported, community or wip (wip: synodeb-setup.sh needs --experimental)
BAYS="4"
# kernel console: tty0 only, as on the DS920+ (same LPSS UART 2 at PCI 00:18.2, not checked
# on this unit)
CONSOLE="console=tty0"
# DOM (synoboot): FAT volume id of synoboot1, ext2 UUID of synoboot2, minimum sizes in bytes
# (blkid under DSM 7.4.1: the same as the DS920+)
DOM_FAT_ID="10EE-589C"
DOM_EXT_UUID="45e5b07d-4783-4867-a369-f99c0cd1e610"
DOM_P1_MIN="16777216"
DOM_P2_MIN="67108864"
