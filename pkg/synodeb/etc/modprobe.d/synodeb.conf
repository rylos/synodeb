# synology_nas is built into the kernel: its options (DSM defaults spinup_groups=2,1,1
# spinup_delay=11 settle_ms=3000) can only be changed on the kernel command line, e.g.
# synology_nas.spinup_delay=11, not here.

# Never loaded ("install ... /bin/true": even an explicit modprobe does nothing, without an error):
#  sp5100_tco  same timer as the ACPI WDAT watchdog (wdat_wdt, used by systemd)
#  spi_amd     SPI controller of the BIOS flash
#  rtc_cmos    DSM does not use the CMOS RTC: rtc0 must be the S-35390A (scheduled wake-up)
blacklist sp5100_tco
install sp5100_tco /bin/true
blacklist spi_amd
install spi_amd /bin/true
blacklist rtc_cmos
install rtc_cmos /bin/true

# Useless on the NAS: audio (no codec attached), EDAC (non-ECC RAM)
blacklist snd_hda_intel
blacklist snd_pci_acp3x
blacklist snd_rn_pci_acp3x
blacklist snd_acp_pci
blacklist amd64_edac

# Intel iGPU (DS920+): load the GuC and HuC firmware (firmware-misc-nonfree). HuC is needed
# for low-power (VDEnc) H.264 encoding with VA-API/QSV. i915 calls the option "dangerous"
# and taints the kernel; nothing else changes (GuC submission stays off on Gemini Lake).
options i915 enable_guc=2
