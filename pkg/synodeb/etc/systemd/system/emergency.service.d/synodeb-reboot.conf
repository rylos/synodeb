# synodeb: a NAS has no screen. synodeb-emergency.service brings up the network and an sshd,
# and sends an urgent notification; the NAS reboots by itself after 10 minutes, later while
# someone is logged in over ssh (/usr/lib/synodeb/emergency).
# To stay: systemctl stop 'synodeb-emergency-reboot*.timer'
[Service]
ExecStartPre=-/usr/bin/systemd-run --unit=synodeb-emergency-reboot --on-active=10min /usr/lib/synodeb/emergency reboot
# leaving the mode (e.g. systemctl default) cancels the reboot
ExecStopPost=-/usr/bin/systemctl --no-block stop synodeb-emergency-reboot*.timer
