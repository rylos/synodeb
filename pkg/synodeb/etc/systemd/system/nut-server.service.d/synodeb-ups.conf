# synodeb: stays active in UPS Safe Mode (systemctl isolate synodeb-ups-safe.target)
[Unit]
IgnoreOnIsolate=yes
# with NETWORK_CLIENTS upsd listens on network addresses: start after the network and the
# firewall (synodeb-network-clients.conf, written by 'synodeb-ups setup', binds it to the firewall)
Wants=network-online.target
After=network-online.target synodeb-nut-firewall.service
