# synodeb — notifications (/usr/lib/synodeb/notify). Shell syntax, read as root.
# Until a backend is configured, notifications only go to the journal
# (journalctl -t synodeb-notify). Contains secrets: keep the file 0600 root.
# Test: /usr/lib/synodeb/notify -f -p high "test" "test notification"

# minimum priority sent: low | normal | high | urgent
#MIN_PRIORITY=normal
# the same message is not sent again within N minutes
#REPEAT_MINUTES=30

# --- email via msmtp (msmtp package) ---
#EMAIL_TO="admin@example.org"          # several recipients separated by spaces
#EMAIL_FROM="nas@example.org"
#SMTP_HOST=smtp.example.org
#SMTP_PORT=587
#SMTP_TLS=starttls                     # starttls | tls (port 465) | off
#SMTP_USER="nas@example.org"
#SMTP_PASSWORD_FILE=/etc/synodeb/smtp.password   # 0600 file containing only the password

# --- Telegram bot (token from @BotFather, chat id from getUpdates) ---
#TELEGRAM_TOKEN="123456:ABC..."
#TELEGRAM_CHAT_ID="123456789"

# --- ntfy (https://ntfy.sh or a self-hosted server) ---
#NTFY_URL="https://ntfy.sh/hard-to-guess-topic-name"
#NTFY_TOKEN=""                         # access token, if the topic is protected
