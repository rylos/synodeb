# synodeb — UPS (/usr/sbin/synodeb-ups). Shell syntax.
# Monitored UPS (section of /etc/nut/ups.conf @ local upsd)
#UPS=ups@localhost
# 1 = dry run: Safe Mode is only simulated and logged to the journal (journalctl -t synodeb-ups),
# no isolate/umount/standby/reboot
#DRYRUN=0
# NOCOMM (UPS unreachable for 300 s): onbatt = Safe Mode only if the UPS was on battery
# (default); always = like DSM, even with mains power present (stuck driver, USB cable);
# never = notification only
#NOCOMM_SAFEMODE=onbatt
# yes = when the battery is exhausted, ask the UPS to power off (DSM "ups_safeshutdown", default no)
#SAFESHUTDOWN=no
# IPs (v4/v6, space separated) that upsd answers on port 3493, e.g. Home
# Assistant or another NAS running NUT/DSM as a client, or networks (192.0.2.0/24). Empty =
# localhost only. Needs nftables: upsd runs only while synodeb-nut-firewall is active.
# After changing: synodeb-ups setup --keep-password && systemctl restart synodeb-nut-firewall nut-server
#NETWORK_CLIENTS=""
