# synodeb-dom: the filesystems of the DOM (boot flash), loaded at boot so that a service
# whose children cannot load modules (ProtectKernelModules=yes) can still mount it.
# vfat with the kernel defaults (codepage 437, iocharset ascii) also needs nls_cp437 and
# nls_ascii; the ext2 partition is mounted by ext4.
vfat
nls_cp437
nls_ascii
ext4
