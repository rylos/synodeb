# synodeb: kernel and initrd live on the Synology DOM (synoboot2, ext2, 84 MB, shared with
# the two DSM boot files and two kernels: DEBIAN and DEBIAN_OLD), so the initrd stays small.
#  MODULES=dep    only the modules this NAS needs for its root (disk, RAID, LVM, LUKS, fs);
#                 hooks/synodeb adds the DOM (USB, vfat) and the watchdog
#  COMPRESS=xz    xz -9e: smaller than zstd -19 by ~0.8 MB, ~0.5 s slower to unpack
#  RESUME=none    no resume from hibernation: a NAS does not hibernate, and with the root on
#                 two drives the swap partition picked for resume is on one of them only, so
#                 with that drive missing the boot would wait for it
MODULES=dep
COMPRESS=xz
COMPRESSLEVEL=9e
RESUME=none
