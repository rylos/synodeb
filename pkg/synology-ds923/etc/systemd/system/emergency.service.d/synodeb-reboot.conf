# synodeb: the DS923+ has no screen, so the emergency shell (failed fsck, missing mount...)
# is only reachable on the internal serial port: the NAS reboots by itself after 10 minutes.
# From the serial console: systemctl stop synodeb-emergency-reboot.timer
[Service]
ExecStartPre=-/usr/bin/systemd-run --unit=synodeb-emergency-reboot --on-active=10min /usr/bin/systemctl reboot
# leaving the shell (e.g. systemctl default) cancels the reboot
ExecStopPost=-/usr/bin/systemctl --no-block stop synodeb-emergency-reboot.timer
