# synohwd — configuration (defaults shown commented out)
# fan_mode = "low"          # low = DSM quiet mode, high = cool mode, full = 99%
# fan_period = 20           # seconds between adjustments (5..300)
# fan_min_duty = 0          # 0..99; invalid values are logged and replaced by the default
# hysteresis = 3
# thermal_shutdown = true   # power off at the DSM thresholds (disks 61°C, NVMe 70°C, CPU 95°C)
# power_button = "poweroff" # poweroff | ignore | "command:/path/to/script"
# reset_button = "log"
# beep_on_start = true
# beep_on_error = true
# disk_leds = true         # green = disk present, goes off on every ATA command (kernel trigger "ataN")
# led_brightness = 255     # 1..254 dims the LEDs (PWM A, shared); also applies with the activity trigger
# (led_activity_hz no longer exists: the kernel does the blinking, the daemon checks the LEDs at 1 Hz)
# disk_standby_minutes = 0  # e.g. 20: spin the disks down after 20 minutes of inactivity
# wol = false              # Wake-on-LAN on all lan* ports
# ac_recovery = true       # power back on after a power failure (like the DSM default)
# scheduled power-on: rtcwake -d rtc0 -m no -t <epoch>  (the daemon informs the microcontroller at shutdown)
