# synodeb board file: everything specific to one model. Read by synodeb-setup.sh (embedded by
# tools/sync-boards.sh), the installer and the synology package (/usr/share/synodeb/boards).
# Shell syntax, KEY="value" lines only, no commands.
MODEL="DS415+"          # syno_hw_version under DSM
PLATFORM="avoton"       # platforms/<platform>
TIER="wip"              # supported, community or wip (wip: synodeb-setup.sh needs --experimental)
BAYS="4"
# under Debian the DMI names are placeholders (Insyde MohonPeak, also on the DS2415+): the
# model is the MohonPeak board with the SiI3132 SATA controller (PCI 1095:3132, 01:00.0)
DMI_PRODUCT="MohonPeak"
PCI_DEVICE="1095:3132"
# kernel console: DSM puts its console on ttyS0 (I/O 0x3f8); the front-panel microcontroller
# is on ttyS1 (I/O 0x2f8)
CONSOLE="console=tty0 console=ttyS0,115200n8"
# DOM (synoboot): MBR, two FAT partitions; the boot loader reads GRUB legacy syntax (title,
# root, kernel). The FAT volume ids differ from unit to unit: checked by structure instead.
DOM_LOADER="grub-legacy"
DOM_P2_FS="vfat"
DOM_FAT_ID=""
DOM_EXT_UUID=""
DOM_P1_MIN="16000000"
DOM_P2_MIN="67108864"
