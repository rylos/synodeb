# DKMS: run "make sources" here first (copies the driver sources into this directory),
# then "dkms add ." / "dkms install synology-eunit-9705/0.1". The kernel must have the PMP
# vendor-register API (CONFIG_SATA_PMP_VENDOR_EH), otherwise the build stops with an #error.
PACKAGE_NAME="synology-eunit-9705"
PACKAGE_VERSION="0.1"
BUILT_MODULE_NAME[0]="synology_eunit_9705"
DEST_MODULE_LOCATION[0]="/extra"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
